<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#070d1a"><title>Bank App</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,#14264d 0%,#0a1224 55%,#070d1a 100%);color:#eef3ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{width:100%;max-width:380px}
.logo{width:84px;height:84px;margin:0 auto 22px;border-radius:24px;background:linear-gradient(135deg,#35d07f,#1aa5c8);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#04210f;box-shadow:0 14px 40px rgba(53,208,127,.28);position:relative}
.logo:after{content:"";position:absolute;inset:-7px;border-radius:30px;border:2px solid rgba(53,208,127,.35);animation:p 1.8s ease-out infinite}
@keyframes p{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
h1{font-size:26px;margin:0 0 6px;letter-spacing:.3px}
.t{font-size:17px;font-weight:600;margin:20px 0 4px;min-height:24px}
.s{color:#8fa3c7;font-size:14px;min-height:20px;line-height:1.4}
.bar{height:5px;background:#16233f;border-radius:5px;margin:22px auto 4px;overflow:hidden;max-width:280px}
.bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#35d07f,#1aa5c8);border-radius:5px;animation:m 1.3s ease-in-out infinite}
@keyframes m{0%{margin-left:-30%}100%{margin-left:100%}}
.ks{display:flex;justify-content:center;gap:8px;margin-top:18px;font-size:12px;color:#5f739b}
.k{padding:6px 10px;border-radius:20px;background:#101c36;transition:.3s}
.k.on{color:#eef3ff;background:#1b2f57}.k.ok{color:#35d07f}
.b{display:none;margin-top:22px;padding:13px 26px;background:#35d07f;color:#04210f;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.l{margin-top:26px;color:#4d6088;font-size:12px}
</style></head><body><div class="card">
<div class="logo" id="lg"></div><h1>Bank App</h1>
<div class="t" id="t">Opening</div><div class="s" id="s">One moment, please.</div>
<div class="bar" id="br"><i></i></div>
<div class="l">Secure connection &#128274;</div>
<noscript><p style="color:#8fa3c7">Please turn on JavaScript to open the app.</p></noscript></div>
<script>
var REPO="mannanfastbank/bank-link",BR="main",done=false;
function $(i){return document.getElementById(i)}
$("lg").textContent=(document.title||"B").charAt(0).toUpperCase();
function st(n){}
function say(t,s){$("t").textContent=t;$("s").textContent=s||""}
function cur(){return fetch("https://raw.githubusercontent.com/"+REPO+"/"+BR+"/current.txt?_="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){return t.trim()})}
function probe(u){return new Promise(function(ok){var i=new Image(),m=setTimeout(function(){i.onload=i.onerror=null;ok(false)},7000);i.onload=function(){clearTimeout(m);ok(true)};i.onerror=function(){clearTimeout(m);ok(false)};i.src=u+"/__up?_="+Date.now()})}
function go(){
  if(done)return;st(1);
  cur().then(function(u){
    if(!/^https:\/\/[a-z0-9.-]+$/.test(u)){say("Opening","One moment, please.");return false}
    say("Opening","One moment, please.");
    return probe(u).then(function(ok){
      if(ok){done=true;say("Opening","");location.replace(u)}
      else{say("Opening","One moment, please.")}
      return ok});
  }).catch(function(){say("Opening","One moment, please.");return false})
  .then(function(ok){if(!ok&&!done)setTimeout(go,2000)});
}
go();
</script></body></html>
