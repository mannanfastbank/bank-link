<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Bank App</title>
<style>
html,body{height:100%;margin:0}
body{background:#0b1220;color:#e8eefc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
.c{padding:24px}
.sp{width:46px;height:46px;border:4px solid #1f2d4a;border-top-color:#35d07f;border-radius:50%;margin:0 auto;animation:r .9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.n{font-size:22px;font-weight:700;letter-spacing:.3px;margin:18px 0 6px}
.s{color:#8fa3c7;font-size:15px}
.b{display:inline-block;margin-top:18px;padding:12px 22px;background:#35d07f;color:#04210f;border-radius:10px;font-weight:700;text-decoration:none}
</style></head><body><div class="c"><div class="sp" id="sp"></div><div class="n">Bank App</div><div class="s" id="s">Opening...</div><div id="x"></div></div>
<noscript><p style="color:#8fa3c7">Please turn on JavaScript to open the app.</p></noscript>
<script>
var u="";
function show(m){document.getElementById("sp").style.display="none";document.getElementById("s").textContent=m;}
function btn(){var a=document.createElement("a");a.className="b";if(u){a.href=u;a.textContent="Tap to open";}else{a.href="";a.textContent="Try again";}document.getElementById("x").appendChild(a);}
fetch("https://raw.githubusercontent.com/mannanfastbank/bank-link/main/current.txt?_="+Date.now(),{cache:"no-store"})
.then(function(r){if(!r.ok)throw 0;return r.text();})
.then(function(t){u=t.trim();if(/^https:\/\//.test(u)){location.replace(u);setTimeout(function(){show("Taking longer than usual");btn();},5000);}else{show("The link is not ready yet");btn();}})
.catch(function(){show("Could not load the link");btn();});
</script></body></html>
